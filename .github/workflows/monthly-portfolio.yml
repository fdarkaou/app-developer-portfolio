# Example: post a rival developer's portfolio on the 1st of each month. Disabled until you set ENABLE_PORTFOLIO=true.
# Secrets: PEEKPANDA_TOKEN (PeekPanda API key), PORTFOLIO_WEBHOOK_URL (Slack or Discord incoming webhook).
name: monthly-portfolio
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
jobs:
  portfolio:
    if: vars.ENABLE_PORTFOLIO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Portfolio report
        env:
          PEEKPANDA_TOKEN: ${{ secrets.PEEKPANDA_TOKEN }}
          PORTFOLIO_WEBHOOK_URL: ${{ secrets.PORTFOLIO_WEBHOOK_URL }}
        run: |
          # One call per developer id. Replace these example ids with the studios you watch.
          node cli.js 1000000000 1000000001 --webhook "$PORTFOLIO_WEBHOOK_URL" >> "$GITHUB_STEP_SUMMARY"
